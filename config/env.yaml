params:
  width: 1920
  height: 720
  square: true
  hexagon: false
  rows: 12
  cols: 12
  ui_scale: 1.0   # font and widget scale, 0.5-4 (e.g. 2.0 on 4K screens)

# Optional: absolute paths to external MAPF solver executables.
# Solvers left unset (or pointing to missing files) are reported as
# unavailable in the UI instead of failing cryptically.
#
# solvers:
#   cbs: /absolute/path/to/CBSH2-RTC/cbs
#   lacam: /absolute/path/to/lacam/build/main
#   lacam2: /absolute/path/to/lacam2/build/main
#   lacam3: /absolute/path/to/lacam3/build/main
