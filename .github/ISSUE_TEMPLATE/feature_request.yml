name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: >
        Describe the workflow you are trying to achieve (e.g. "benchmark my
        solver X against LaCAM on hex grids and plot ...").
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - GUI / visualization
        - Batch experiments / CLI
        - Solver integration
        - File formats
        - Build / packaging
        - Documentation
        - Other
